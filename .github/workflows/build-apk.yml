name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/hermes.keystore \
            -alias hermes-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Hermes Chat, OU=Dev, O=Hermes, L=Vancouver, ST=BC, C=CA"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: app/hermes.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: android
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: hermes-key
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-chat-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          retention-days: 7

      - name: Check APK size
        run: ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            android/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
