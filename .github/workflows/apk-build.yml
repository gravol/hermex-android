name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hermes-chat-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hermes Chat ${{ github.ref_name }}
          body: |
            Hermes Desktop for Android

            - Loads https://hermes-agent.nousresearch.com/ (Official Hermes Desktop UI)
            - Configure gateway Settings → Remote: http://100.80.204.66:9119
            - Requires Tailscale active on device
            - Min SDK 26, Target SDK 34
            - Edge-to-edge with proper keyboard handling
            - Install via Obtainium from this repo
          files: hermes-chat-app.apk
